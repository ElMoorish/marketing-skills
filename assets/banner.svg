<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">Marketing Skills</title>
  <desc id="d">One brand file. Five focused skills. Works across AI agents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11142A"/>
      <stop offset="1" stop-color="#1C1240"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6B4A"/>
      <stop offset="1" stop-color="#FFB547"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF6B4A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FF6B4A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#dots)"/>
  <circle cx="960" cy="200" r="240" fill="url(#glow)"/>

  <!-- Left: wordmark -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="72" y="84" width="236" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.15"/>
    <circle cx="92" cy="99" r="5" fill="#2EC4B6"/>
    <text x="106" y="104" font-size="13" font-weight="600" letter-spacing="1.6" fill="#C9CCE8">OPEN-SOURCE AGENT SKILLS</text>

    <text x="70" y="186" font-size="68" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">Marketing</text>
    <text x="70" y="256" font-size="68" font-weight="800" fill="url(#accent)" letter-spacing="-1.5">Skills</text>

    <text x="72" y="304" font-size="20" fill="#C9CCE8">One brand file. Five focused skills.</text>
    <text x="72" y="332" font-size="20" fill="#C9CCE8">Every AI agent you already use.</text>
  </g>

  <!-- Right: hub diagram -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
    <!-- connectors -->
    <g stroke="#FFB547" stroke-opacity="0.55" stroke-width="2" fill="none" stroke-dasharray="4 6">
      <path d="M884 200 C 830 200, 820 92, 760 92"/>
      <path d="M884 200 C 830 200, 820 200, 760 200"/>
      <path d="M884 200 C 830 200, 820 308, 760 308"/>
      <path d="M1036 200 C 1070 200, 1060 140, 1090 140"/>
      <path d="M1036 200 C 1070 200, 1060 260, 1090 260"/>
    </g>

    <!-- hub card: brand-context.md -->
    <rect x="884" y="132" width="152" height="136" rx="16" fill="#FFFFFF"/>
    <rect x="884" y="132" width="152" height="34" rx="16" fill="url(#accent)"/>
    <rect x="884" y="150" width="152" height="16" fill="url(#accent)"/>
    <text x="960" y="155" text-anchor="middle" font-size="13" fill="#11142A">brand-context.md</text>
    <rect x="902" y="184" width="104" height="7" rx="3.5" fill="#11142A" fill-opacity="0.75"/>
    <rect x="902" y="200" width="116" height="7" rx="3.5" fill="#11142A" fill-opacity="0.25"/>
    <rect x="902" y="216" width="84" height="7" rx="3.5" fill="#11142A" fill-opacity="0.25"/>
    <rect x="902" y="232" width="100" height="7" rx="3.5" fill="#2EC4B6"/>
    <rect x="902" y="248" width="64" height="7" rx="3.5" fill="#11142A" fill-opacity="0.25"/>

    <!-- skill pills, left -->
    <g fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.2">
      <rect x="574" y="72" width="186" height="40" rx="20"/>
      <rect x="574" y="180" width="186" height="40" rx="20"/>
      <rect x="574" y="288" width="186" height="40" rx="20"/>
      <rect x="1090" y="120" width="174" height="40" rx="20"/>
      <rect x="1090" y="240" width="174" height="40" rx="20"/>
    </g>
    <g fill="#FFFFFF">
      <text x="672" y="97" text-anchor="middle">seo-audit</text>
      <text x="672" y="205" text-anchor="middle">content-brief</text>
      <text x="672" y="313" text-anchor="middle">campaign-review</text>
      <text x="1184" y="145" text-anchor="middle">social-posts</text>
      <text x="1184" y="264" text-anchor="middle" font-size="12.5">brand-context-builder</text>
    </g>
    <g fill="#FF6B4A">
      <circle cx="590" cy="92" r="4"/>
      <circle cx="590" cy="200" r="4"/>
      <circle cx="590" cy="308" r="4"/>
      <circle cx="1102" cy="140" r="4"/>
      <circle cx="1102" cy="260" r="4"/>
    </g>
  </g>
</svg>
