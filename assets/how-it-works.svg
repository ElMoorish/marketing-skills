<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="t d">
  <title id="t">How it works</title>
  <desc id="d">Step 1: fill in brand-context.md once. Step 2: ask your agent for a marketing task. Step 3: the skill reads your brand file and returns a draft you approve.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11142A"/>
      <stop offset="1" stop-color="#1C1240"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6B4A"/>
      <stop offset="1" stop-color="#FFB547"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#FFB547"/>
    </marker>
  </defs>
  <rect width="1280" height="340" rx="24" fill="url(#bg)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- arrows -->
    <g stroke="#FFB547" stroke-width="2.5" stroke-dasharray="5 7" fill="none" marker-end="url(#arrow)">
      <path d="M432 170 H 480"/>
      <path d="M832 170 H 880"/>
    </g>

    <!-- step cards -->
    <g fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.16">
      <rect x="48" y="48" width="376" height="244" rx="20"/>
      <rect x="452" y="48" width="376" height="244" rx="20" transform="translate(36 0)"/>
      <rect x="892" y="48" width="340" height="244" rx="20"/>
    </g>

    <!-- step 1 -->
    <circle cx="92" cy="92" r="20" fill="url(#accent)"/>
    <text x="92" y="99" text-anchor="middle" font-size="18" font-weight="800" fill="#11142A">1</text>
    <text x="126" y="99" font-size="22" font-weight="700" fill="#FFFFFF">Fill in your brand file</text>
    <text x="72" y="146" font-size="16" fill="#C9CCE8">Customer, positioning, voice, and the</text>
    <text x="72" y="170" font-size="16" fill="#C9CCE8">proof you're allowed to cite. Once.</text>
    <rect x="72" y="200" width="328" height="68" rx="12" fill="#0B0D1C"/>
    <text x="92" y="231" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#2EC4B6">.agents/brand-context.md</text>
    <text x="92" y="253" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#8A8FB8">or run brand-context-builder</text>

    <!-- step 2 -->
    <circle cx="532" cy="92" r="20" fill="url(#accent)"/>
    <text x="532" y="99" text-anchor="middle" font-size="18" font-weight="800" fill="#11142A">2</text>
    <text x="566" y="99" font-size="22" font-weight="700" fill="#FFFFFF">Ask your agent</text>
    <text x="512" y="146" font-size="16" fill="#C9CCE8">In Claude, Claude Code, Cursor or</text>
    <text x="512" y="170" font-size="16" fill="#C9CCE8">Antigravity. The right skill loads.</text>
    <rect x="512" y="200" width="292" height="68" rx="12" fill="#0B0D1C"/>
    <text x="532" y="231" font-size="15" fill="#FFFFFF">"Audit example.com for SEO</text>
    <text x="532" y="253" font-size="15" fill="#FFFFFF"> and AI search visibility."</text>

    <!-- step 3 -->
    <circle cx="936" cy="92" r="20" fill="url(#accent)"/>
    <text x="936" y="99" text-anchor="middle" font-size="18" font-weight="800" fill="#11142A">3</text>
    <text x="970" y="99" font-size="22" font-weight="700" fill="#FFFFFF">Review the draft</text>
    <text x="916" y="146" font-size="16" fill="#C9CCE8">On-brand, no invented stats.</text>
    <text x="916" y="170" font-size="16" fill="#C9CCE8">Nothing publishes without you.</text>
    <g font-size="14" font-weight="600">
      <rect x="916" y="200" width="132" height="30" rx="15" fill="#17B26A" fill-opacity="0.18" stroke="#17B26A"/>
      <text x="982" y="220" text-anchor="middle" fill="#5BE3A2">Proof checked</text>
      <rect x="1058" y="200" width="132" height="30" rx="15" fill="#FF6B4A" fill-opacity="0.15" stroke="#FF6B4A"/>
      <text x="1124" y="220" text-anchor="middle" fill="#FF9A82">Draft only</text>
      <rect x="916" y="238" width="132" height="30" rx="15" fill="#3A86FF" fill-opacity="0.15" stroke="#3A86FF"/>
      <text x="982" y="258" text-anchor="middle" fill="#8DB8FF">Brand voice</text>
    </g>
  </g>
</svg>
