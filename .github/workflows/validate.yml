name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate and build
        run: python3 scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: skill-zips
          path: dist/*.zip
